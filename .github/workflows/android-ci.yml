name: Android CI • Tests & Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already provides Android command-line tools.
      # android-actions/setup-android@v3 currently fails trying to install retired "tools".
      - name: Install Android platform 36.1
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      # The repository does not yet include gradlew or gradle-wrapper.jar.
      # Install the exact Gradle distribution required by AGP 9.1.1.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Run unit and Robolectric tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Verify APK checksum
        if: success()
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload AuraEQ debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraEQ-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraEQ-ci-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
